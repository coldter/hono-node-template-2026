name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ultracite check)
        run: bun run check

      - name: Type-check
        run: bun run check-types

      - name: Knip
        run: bun run knip

      - name: Build
        run: bun run build

      - name: Generated client drift check
        run: |
          bun run generate-client
          git add -N apps/web/src/api.gen
          git diff --exit-code -- apps/web/src/api.gen

      - name: Migration drift check
        run: |
          bun run db:generate
          git add -N packages/db/src/migrations
          git diff --exit-code -- packages/db/src/migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Test
        run: bun run test
